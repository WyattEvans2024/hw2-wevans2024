[project]
name = "study-notes-assistant"
version = "0.1.0"
description = "Study Notes Assistant with local RAG and ChatGPT-backed answer generation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langchain>=0.3.26",
  "langchain-chroma>=0.2.4",
  "langchain-community>=0.3.26",
  "langchain-core>=0.3.26",
  "langchain-text-splitters>=0.3.26",
  "chromadb>=1.0.12",
  "fastembed>=0.6.0",
  "chainlit>=1.3.2",
  "openai-codex>=0.1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false
